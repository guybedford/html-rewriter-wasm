name: Test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2
      - uses: Swatinem/rust-cache@v1
        with:
          cache-on-failure: true
      - name: Use Node.js LTS
        uses: actions/setup-node@v2
        with:
          node-version: lts/*
      - name: Install wasm-opt
        run: |
          wget https://github.com/WebAssembly/binaryen/releases/download/version_118/binaryen-version_118-x86_64-linux.tar.gz
          tar -xzf binaryen-version_118-x86_64-linux.tar.gz
          sudo cp binaryen-version_118/bin/wasm-opt /usr/local/bin/
      - name: Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli@0.2.74
      - run: npm ci
      - run: npm run build
      - run: npm test
